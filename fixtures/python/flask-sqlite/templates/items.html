{% extends 'base.html' %}
{% block content %}
<h1>Itens</h1>
<p><a id="atualizar" href="/items">Atualizar lista</a></p>
<ul>
{% for item in items %}<li>{{ item.title }}</li>{% endfor %}
</ul>
<form method="post" action="/items">
  <input name="title" placeholder="novo item">
  <button type="submit">Acrescentar</button>
</form>
{% endblock %}
