<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeTAC — structure</title>
<style>
:root { --bg:#f7f7f5; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e4e3de; --accent:#2f5bd3; --code:#f3f2ee; --hit:#fff3bf;
  --l-interface:#dbe7ff; --l-routes:#e5dcff; --l-logic:#d9f2e3; --l-data:#ffe6cc; --l-external:#ffd9de; --l-support:#ecebe6;
  --b-interface:#5b7fd6; --b-routes:#8467d7; --b-logic:#3f9d68; --b-data:#d18a3a; --b-external:#d0566a; --b-support:#9a9993;
  --a-imports:#9a9993; --a-calls:#2f5bd3; --a-data:#d18a3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --text:#ecebe6; --muted:#9a9993; --line:#33332f; --accent:#7ea2ff; --code:#262624; --hit:#4a4320;
  --l-interface:#23304f; --l-routes:#2f2748; --l-logic:#1f3a2b; --l-data:#40301d; --l-external:#442329; --l-support:#2a2a27;
  --a-imports:#77766f; --a-calls:#7ea2ff; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; height:100vh; display:flex; flex-direction:column; }
header { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:14px; margin:0; }
.muted { color:var(--muted); }
.search { position:relative; margin-left:auto; }
.search input { width:220px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
.results { position:absolute; right:0; top:28px; width:340px; max-height:320px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.18); z-index:5; }
.results button { all:unset; display:block; width:100%; padding:6px 10px; cursor:pointer; box-sizing:border-box; }
.results button:hover, .results button:focus { background:var(--code); }
.results small { color:var(--muted); display:block; }
button.plain { all:unset; cursor:pointer; color:var(--accent); }
main { flex:1; display:flex; min-height:0; }
#canvas { flex:1; overflow:auto; position:relative; }
#canvas svg { display:block; margin:16px auto; }
aside { width:360px; max-width:45vw; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px; display:none; }
aside.on { display:block; }
aside h2 { font-size:14px; margin:0 0 6px; }
aside h3 { font-size:12px; margin:14px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
aside ul { margin:0; padding-left:0; list-style:none; }
aside li { margin:3px 0; }
.fact { all:unset; cursor:pointer; display:block; padding:3px 6px; border-radius:5px; overflow-wrap:anywhere; }
.fact:hover, .fact:focus { background:var(--code); }
.facts > li > div { padding-left:10px; }
.small { font-size:11px; }
.explain { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
.explain pre { white-space:pre-wrap; max-height:260px; }
.explain.inline { margin-top:4px; border-top:0; padding-top:0; }
.explanation { border-left:3px solid var(--accent); padding-left:10px; }
.proof { all:unset; display:inline-block; cursor:pointer; color:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; overflow-wrap:anywhere; }
pre { background:var(--code); padding:8px; border-radius:6px; overflow:auto; font-size:12px; margin:6px 0; }
pre .hit { background:var(--hit); display:block; }
.legend { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; }
.legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--line); }
.legend svg { vertical-align:middle; }
.status { padding:24px; color:var(--muted); }
.box rect { stroke-width:1.2; }
.box { cursor:pointer; }
.box text { fill:var(--text); font-size:12px; pointer-events:none; }
.box .sub { fill:var(--muted); font-size:11px; }
.box.sel rect.frame, .box.hit rect.frame { stroke:var(--accent); stroke-width:2.5; }
.arrow { fill:none; cursor:pointer; }
.arrow.possible { stroke-dasharray:5 4; }
.arrow.sel { stroke:var(--accent) !important; }
.arrow-hit { stroke:transparent; stroke-width:12; fill:none; cursor:pointer; }
.count { font-size:10px; fill:var(--muted); pointer-events:none; }
.note { fill:#d0566a; }
.note-text { fill:#fff; font-size:10px; font-weight:700; pointer-events:none; }
body.embed h1 { display:none; }
/* The Diff's report (phase D3): only the plan, as its map. */
body.maponly header, body.maponly #side, body.maponly #tracebar { display:none; }
body.maponly .changes > :not(.marks) { display:none; }
:root { --a-observed:#d97a1f; }
#tracebar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 12px; background:var(--code); border-bottom:1px solid var(--line); font-size:12px; }
#tracebar b { font-weight:600; }
.box.dim { opacity:.28; }
.box.lit rect.frame { stroke:var(--accent); stroke-width:2.5; }
.arrow.dim { opacity:.12 !important; }
.arrow.lit { opacity:1 !important; }
.leaks { padding:14px 16px; max-width:1200px; }
.leaks h2 { font-size:14px; margin:0 0 4px; }
[hidden] { display:none !important; }
.leaks table { width:100%; border-collapse:collapse; margin:10px 0 18px; background:var(--panel); table-layout:fixed; }
.leaks table.main col.c1 { width:15%; } .leaks table.main col.c2 { width:16%; } .leaks table.main col.c3 { width:39%; } .leaks table.main col.c4 { width:12%; } .leaks table.main col.c5 { width:18%; }
.leaks td { overflow-wrap:anywhere; }
.leaks td pre { max-width:100%; }
.leaks th, .leaks td { text-align:left; vertical-align:top; padding:7px 8px; border-bottom:1px solid var(--line); }
.leaks th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
.leaks td ul { margin:0; padding:0; list-style:none; }
.leaks td li { margin:2px 0; }
.tag { display:inline-block; padding:0 6px; border-radius:9px; font-size:11px; background:var(--code); color:var(--muted); margin-left:4px; }
.tag.client { background:#ffd9de; color:#8a1f33; }
.tag.server { background:#d9f2e3; color:#1f5c3a; }
.warn { color:#b3452e; }
.leaks h3 { font-size:12px; margin:16px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.findings { list-style:none; padding:0; margin:0; }
.findings > li { padding:6px 10px; margin:4px 0; border-radius:6px; background:var(--panel); border-left:3px solid var(--line); }
.findings ul { list-style:none; padding-left:0; margin:2px 0 0; }
.findings.alert > li { border-left-color:#d0566a; }
.findings.warning > li { border-left-color:#d18a3a; }
header button.plain.on { font-weight:600; text-decoration:underline; }
header a.plain { color:var(--accent); text-decoration:none; }
.arrow.inferred { stroke-dasharray:2 4; }
.arrow.never { stroke-dasharray:7 5; }
.arrow.observed { stroke-dasharray:4 3; }
.er { overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--bg); max-height:70vh; }
.er svg { display:block; margin:0; }
.zoom { display:flex; gap:12px; align-items:center; margin:12px 0 6px; }
.zoom button.plain { font-weight:600; min-width:14px; text-align:center; }
.findings.health > li { border-left-color:#8467d7; }
.leaks details > summary { cursor:pointer; font-size:12px; margin:14px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; }
.findings.health > li > div:first-child b { font-weight:600; }
.tbox.sel rect.frame { stroke:var(--accent); stroke-width:2.5; }
.box.ch-added rect.frame { stroke:#2e9d5b; stroke-width:2.5; }
.box.ch-removed rect.frame { stroke:#d0566a; stroke-width:2; stroke-dasharray:6 4; }
.box.ch-removed text { text-decoration:line-through; opacity:.75; }
.box.ch-changed rect.frame, .box.ch-moved rect.frame { stroke:#d18a3a; stroke-width:2.5; }
.box.ch-inside rect.frame { stroke:#d18a3a; stroke-width:1.8; stroke-dasharray:2 3; }
.box.ch-none { opacity:.45; }
.ch-badge { font-size:11px; font-weight:700; pointer-events:none; }
.arrow.ch-added { stroke:#2e9d5b !important; opacity:1 !important; }
.arrow.ch-removed { stroke:#d0566a !important; stroke-dasharray:6 4; opacity:1 !important; }
.arrow.ch-changed { stroke:#d18a3a !important; opacity:1 !important; }
.changes { padding:14px 16px 0; max-width:1200px; margin:0 auto; }
/* The path of an action before and after a prompt (the Diff, phase D5), over the changes. */
.box.path-off { opacity:.25; }
.box.path-added rect.frame { stroke:#2e9d5b; stroke-width:4.5; }
.box.path-removed rect.frame { stroke:#d0566a; stroke-width:4.5; stroke-dasharray:7 4; }
.box.path-changed rect.frame { stroke:#e0a100; stroke-width:4.5; }
.box.path-same rect.frame { stroke:var(--accent); stroke-width:3.5; }
.changes h2 { font-size:14px; margin:0 0 4px; }
.changes .bar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:6px 0; }
.changes select, .changes input[type=text] { font:inherit; padding:2px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
.findings.info > li { border-left-color:var(--line); }
.changes .list { max-height:38vh; overflow:auto; }
.changes .findings > li > div:first-child { display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; }
.changes .findings .fact, aside .findings .fact { display:inline-block; }
.findings > li.lit { background:var(--hit); }
.changes .marks i { display:inline-block; width:14px; height:10px; border:2px solid; border-radius:3px; vertical-align:-1px; margin:0 4px 0 8px; }
.predict { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:8px 0; }
.predict h3 { font-size:13px; margin:0 0 4px; }
.predict fieldset { border:0; padding:0; margin:6px 0; }
.predict legend { font-size:12px; font-weight:600; padding:0; }
.predict .chips { list-style:none; padding:0; margin:2px 0; display:flex; flex-wrap:wrap; gap:4px; }
.predict .chips li { border:1px solid var(--line); border-radius:10px; padding:0 2px 0 8px; font-size:12px; }
.predict .chips button { padding:0 4px; }
.predict .predicted { margin:2px 0 6px; padding-left:18px; font-size:12px; }
.predict h4 { font-size:12px; margin:6px 0 0; }
.changes .findings > li.unread button.fact { font-weight:600; }
.badge { display:inline-block; min-width:16px; padding:0 5px; margin-left:4px; border-radius:9px; background:#d18a3a; color:#fff; font-size:11px; font-weight:600; text-align:center; line-height:16px; }
.quiz .findings > li { padding:8px 12px; }
.quiz .findings > li.right { border-left-color:#2e9d5b; }
.quiz .findings > li.wrong { border-left-color:#d0566a; }
.quiz .choices { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
.quiz .choices button { font:inherit; font-size:12px; padding:3px 10px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); cursor:pointer; }
.quiz .choices button:disabled { cursor:default; opacity:.6; }
.quiz .choices button.answer { border-color:#2e9d5b; opacity:1; font-weight:600; }
.quiz .choices button.picked:not(.answer) { border-color:#d0566a; opacity:1; text-decoration:line-through; }
.tbox { cursor:pointer; } .tbox text { fill:var(--text); font-size:12px; pointer-events:none; } .tbox .sub { fill:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <span id="project" class="muted"></span>
  <span class="legend" id="legend"></span>
  <span class="search"><input id="q" type="search" data-t-placeholder="searchPlaceholder" autocomplete="off" data-t-aria-label="searchLabel"><div class="results" id="results" hidden></div></span>
  <button class="plain" id="coverage" data-t="neverRan" data-t-title="neverRanTitle"></button>
  <button class="plain" id="leaksButton" data-t="leaksButton" data-t-title="leaksButtonTitle"></button>
  <button class="plain" id="secretsButton" data-t="secretsButton" data-t-title="secretsButtonTitle"></button>
  <button class="plain" id="dataButton" data-t="dataButton" data-t-title="dataButtonTitle"></button>
  <button class="plain" id="healthButton" data-t="healthButton" data-t-title="healthButtonTitle"></button>
  <button class="plain" id="diffButton" data-t="diffButton" data-t-title="diffButtonTitle"></button>
  <button class="plain" id="quizButton" data-t="quizButton" data-t-title="quizButtonTitle"></button>
  <button class="plain" id="explainPlan" data-t="explainPlan" data-t-title="explainPlanTitle"></button>
  <button class="plain" id="collapse" data-t="collapse" data-t-title="collapseTitle"></button>
  <a class="plain" id="privacyLink" href="/privacy" data-t="privacyLink" data-t-title="privacyLinkTitle"></a>
</header>
<div id="tracebar" hidden></div>
<main>
  <div id="canvas"><div class="status" id="status" data-t="reading"></div></div>
  <aside id="side" aria-live="polite"></aside>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const run = params.get('run') || '';
  if (params.get('embed') === '1') document.body.classList.add('embed');
  // The map of the Diff's report (phase D3): the Changes view up to the end of a prompt (to=prompt-N-after), only the plan.
  const mapOnly = params.get('map') === '1';
  const diffTo = /^prompt-\d+-after$/.test(params.get('to') || '') ? params.get('to') : '';
  if (mapOnly) document.body.classList.add('maponly');
  const LAYER_CLASS = { interface: 'interface', routes: 'routes', logic: 'logic', data: 'data', external: 'external' };
  // The sentences, from src/structure/text/<language>.json (put here by the panel).
  const TEXT = /*CODETAC_TEXT*/null || { layers: {}, plan: {} };
  const t = (key, vars = {}) => {
    let value = key.split('.').reduce((node, part) => node?.[part], key.includes('.') ? TEXT : TEXT.plan);
    if (value && typeof value === 'object' && 'other' in value) value = vars.count === 1 ? value.one : value.other;
    if (typeof value !== 'string') return key;
    return value.replace(/\{(\w+)\}/g, (hole, name) => (name in vars ? String(vars[name]) : hole));
  };
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = t(node.dataset.t);
  for (const attribute of ['placeholder', 'title', 'aria-label']) {
    for (const node of document.querySelectorAll('[data-t-' + attribute + ']')) node.setAttribute(attribute, t(node.getAttribute('data-t-' + attribute)));
  }
  const LAYER_NAMES = TEXT.layers;
  const storeKey = 'codetac.structure.open.' + run;
  let open = new Set();
  try { open = new Set(JSON.parse(localStorage.getItem(storeKey) || '[]')); } catch {}
  let plan = null;
  // Phase 7: the action (or request) whose path is lit, and a step to focus.
  let action = params.get('action') || '';
  let request = params.get('request') || '';
  let focus = params.get('focus') || '';
  let coverage = false;
  // Phase 4: the «What leaves the machine» view instead of the plan.
  // Phases 4, 5, 6 and 8: a table, the data model or the structure's health instead of the plan (view=leaks | secrets | data | health).
  // Phase 9: the plan with what changed since a snapshot (view=diff). Phase 10: the quiz (view=quiz).
  let view = ['leaks', 'secrets', 'data', 'health', 'diff', 'quiz'].includes(params.get('view')) ? params.get('view') : 'plan';
  let traceInfo = null;
  let openedFor = null;
  let lastText = '';
  let shownReadAt = 0;
  let selected = null;
  let highlight = null;
  const $ = id => document.getElementById(id);
  const svgNS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}, parent) => {
    const node = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (parent) parent.appendChild(node);
    return node;
  };
  const html = (tag, text, attrs = {}) => { const node = document.createElement(tag); if (text != null) node.textContent = text; Object.assign(node, attrs); return node; };
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const layerOf = box => LAYER_CLASS[box.layer] || 'support';
  const save = () => { try { localStorage.setItem(storeKey, JSON.stringify([...open])); } catch {} };

  function legend() {
    const box = $('legend');
    for (const layer of ['interface', 'routes', 'logic', 'data', 'external', 'support']) {
      const item = html('span', LAYER_NAMES[layer].split(',')[0]);
      const swatch = html('i');
      swatch.style.background = css('--l-' + layer);
      swatch.style.borderColor = css('--b-' + layer);
      item.prepend(swatch);
      item.title = LAYER_NAMES[layer];
      box.appendChild(item);
    }
    const arrows = [['calls', t('legendCalls'), false], ['imports', t('legendImports'), false], ['calls', t('legendNotCertain'), true], ['observed', t('legendObserved'), true]];
    for (const [kind, label, dashed] of arrows) {
      const item = html('span', label);
      const svg = el('svg', { width: 26, height: 10 });
      el('line', { x1: 1, y1: 5, x2: 25, y2: 5, stroke: css('--a-' + kind), 'stroke-width': 2, ...(dashed ? { 'stroke-dasharray': '5 4' } : {}) }, svg);
      item.prepend(svg);
      box.appendChild(item);
    }
  }

  async function refresh(wait) {
    if (!run) { $('status').textContent = t('noRun'); return; }
    if (view === 'diff') return refreshDiff(wait);
    if (view === 'quiz') return refreshQuiz(wait);
    if (view !== 'plan') return refreshTable(wait);
    let response;
    try {
      response = await fetch('/api/structure/plan?run=' + encodeURIComponent(run) + '&open=' + encodeURIComponent([...open].join(',')) + (wait ? '&wait=5000' : '') +
        (action ? '&action=' + encodeURIComponent(action) : request ? '&request=' + encodeURIComponent(request) : '') + (focus ? '&focus=' + encodeURIComponent(focus) : '') +
        (coverage ? '&coverage=1' : ''), { cache: 'no-store' });
    } catch { showStatus(t('panelSilent')); return; }
    const body = await response.json().catch(() => ({}));
    if (response.status === 202) { showStatus(t('reading')); setTimeout(() => refresh(true), 500); return; }
    if (!response.ok) { showStatus(body.error || t('unreadable')); return; }
    const text = JSON.stringify(body.plan);
    $('project').textContent = [body.project.name, t('files', { count: body.files }),
      ...(body.unknown ? [t('unknownShare', { percent: Math.round(100 * body.unknown / Math.max(1, body.files)) })] : []),
      t('readIn', { time: body.readMs >= 1000 ? (body.readMs / 1000).toFixed(1) + ' s' : body.readMs + ' ms' }), ...(body.watching ? [t('watching')] : [])].join(' · ');
    shownReadAt = body.readAt;
    traceInfo = body.trace || null;
    traceBar(body);
    // The first time an action is shown, open the blocks it went through (and the focused step).
    const key = action || request;
    if (traceInfo && key && openedFor !== key + '|' + focus) {
      openedFor = key + '|' + focus;
      // The server side of a fresh action may still be running: look again shortly.
      setTimeout(() => { lastText = ''; refresh(); }, 1500);
      let changed = false;
      for (const box of body.plan.boxes) if (box.kind === 'block' && box.lit && box.expandable && !open.has(box.id)) { open.add(box.id); changed = true; }
      for (const id of traceInfo.focus?.open ?? []) if (!open.has(id)) { open.add(id); changed = true; }
      if (traceInfo.focus?.node) { highlight = traceInfo.focus.node; selected = { type: 'box', id: traceInfo.focus.node }; }
      if (changed) { save(); lastText = ''; return refresh(); }
    }
    if (text === lastText) return;
    lastText = text;
    plan = body.plan;
    // Forget open boxes that no longer exist.
    const ids = new Set(plan.boxes.map(box => box.id));
    for (const id of [...open]) if (!ids.has(id)) { open.delete(id); }
    save();
    draw();
    // A step opened from a dossier shows its details at once.
    if (selected && !$('side').classList.contains('on')) details();
  }
  function traceBar(body) {
    const bar = $('tracebar');
    bar.textContent = '';
    const notes = [];
    if (body.traceError) notes.push(html('span', body.traceError));
    if (traceInfo) {
      const ran = traceInfo.steps.length;
      const title = html('span');
      const [before, after] = t('pathOf', { label: '\u0000' }).split('\u0000');
      title.append(before, html('b', traceInfo.label || t('theAction')), after + ' · ' + t('functionsOnPlan', { count: ran }));
      notes.push(title);
      if (traceInfo.observed) notes.push(html('span', t('observedArrows', { count: traceInfo.observed })));
      if (traceInfo.inferred) notes.push(html('span', t('inferredArrows', { count: traceInfo.inferred })));
      if (traceInfo.unmatched.length) {
        const button = html('button', t('notOnPlan', { count: traceInfo.unmatched.length }), { className: 'plain' });
        button.addEventListener('click', () => { selected = { type: 'unmatched' }; details(); });
        notes.push(button);
      }
    }
    if (body.sessionActions != null) notes.push(html('span', t('neverRanOver', { count: body.sessionActions })));
    if (!notes.length) { bar.hidden = true; return; }
    if (traceInfo || body.traceError) {
      const clear = html('button', t('wholePlan'), { className: 'plain' });
      clear.addEventListener('click', () => { action = ''; request = ''; focus = ''; traceInfo = null; highlight = null; lastText = ''; refresh(); });
      notes.push(clear);
    }
    bar.append(...notes);
    bar.hidden = false;
  }
  function showStatus(text) {
    const canvas = $('canvas');
    canvas.textContent = '';
    canvas.appendChild(html('div', text, { className: 'status', id: 'status' }));
  }

  let lastTable = '';
  async function refreshTable(wait) {
    const shown = view;
    let response;
    try { response = await fetch('/api/structure/' + shown + '?run=' + encodeURIComponent(run) + (wait ? '&wait=5000' : ''), { cache: 'no-store' }); }
    catch { showStatus(t('panelSilent')); return; }
    const body = await response.json().catch(() => ({}));
    if (shown !== view) return;
    if (response.status === 202) { showStatus(t('reading')); setTimeout(() => refreshTable(true), 500); return; }
    if (!response.ok) { showStatus(body.error || t('unreadable')); return; }
    shownReadAt = body.readAt;

    const tools = html('p', null, { className: 'zoom' });
    const layout = data.layout;
    const fit = Math.min(1, Math.max(0.3, (Math.min(canvas.clientWidth - 32 - (dataSelected && !$('side').classList.contains('on') ? 360 : 0), 1200) - 36) / Math.max(1, layout.width + 40)));
    if (!dataZoom) dataZoom = fit;
    for (const [label, title, next] of [['−', t('dataZoomOut'), () => dataZoom / 1.25], ['+', t('dataZoomIn'), () => dataZoom * 1.25], [t('dataFit'), t('dataFit'), () => fit]]) {
      const button = html('button', label, { className: 'plain', title });

      tools.appendChild(button);
    }
    tools.appendChild(html('span', Math.round(dataZoom * 100) + '% · ' + t('dataClickTable'), { className: 'muted small' }));
    box.appendChild(tools);
    const area = html('div', null, { className: 'er' });
    const pad = 20;
    const width = layout.width + pad * 2;
    const height = layout.height + pad * 2;
    const svg = el('svg', { width: width * dataZoom, height: height * dataZoom, viewBox: [-pad, -pad, width, height].join(' '), role: 'img', 'aria-label': t('dataDiagram') });
    const defs = el('defs', {}, svg);
    const marker = el('marker', { id: 'head-rel', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: css('--a-data') }, marker);
    const rowY = (table, column) => {
      const place = layout.boxes[table.name];
      const index = table.columns.findIndex(item => item.name === column);
      return place.y + layout.header + (index < 0 || index >= layout.maxRows ? layout.maxRows - 0.5 : index + 0.5) * layout.row + 4;
    };
    const byName = new Map(data.tables.map(table => [table.name, table]));
    const lines = el('g', {}, svg);
    for (const relation of data.relations) {
      if (relation.outside || !layout.boxes[relation.to]) continue;
      const from = layout.boxes[relation.from];
      const to = layout.boxes[relation.to];
      const target = byName.get(relation.to);
      const y1 = rowY(byName.get(relation.from), relation.column);
      const y2 = relation.toColumn ? rowY(target, relation.toColumn) : to.y + layout.header / 2;
      const self = relation.from === relation.to;
      const rightward = to.x >= from.x + from.w;
      const x1 = rightward || self ? from.x + from.w : from.x;
      const x2 = self ? to.x + to.w : rightward ? to.x : to.x + to.w;
      const bend = self ? 40 : Math.max(30, Math.abs(x2 - x1) / 2);
      const d = 'M' + x1 + ',' + y1 + ' C' + (x1 + (rightward || self ? bend : -bend)) + ',' + y1 + ' ' + (x2 + (self || !rightward ? bend : -bend)) + ',' + y2 + ' ' + x2 + ',' + y2;
      const path = el('path', { d, class: 'relation', stroke: css('--a-data'), 'stroke-width': 1.5, fill: 'none', 'marker-end': 'url(#head-rel)' }, lines);
      el('title', {}, path).textContent = relation.from + '.' + relation.column + ' → ' + relation.to + (relation.toColumn ? '.' + relation.toColumn : '');
    }
    for (const table of data.tables) {
      const place = layout.boxes[table.name];
      const g = el('g', { class: 'tbox' + (dataSelected === table.name ? ' sel' : '') + (table.findings.length ? ' flagged' : ''), tabindex: 0, 'data-table': table.name }, svg);
      const alert = table.findings.includes('no-rls-browser');
      el('rect', { class: 'frame', x: place.x, y: place.y, width: place.w, height: place.h, rx: 8, fill: css('--panel'),
        stroke: alert ? '#d0566a' : css('--b-data'), 'stroke-dasharray': table.inferred ? '5 4' : '' }, g);
      el('rect', { x: place.x, y: place.y, width: place.w, height: layout.header - 6, rx: 8, fill: css('--l-data') }, g);
      el('text', { x: place.x + 10, y: place.y + 19, 'font-weight': 600 }, g).textContent = table.name;
      el('text', { class: 'sub', x: place.x + place.w - 8, y: place.y + 19, 'text-anchor': 'end' }, g).textContent = table.inferred ? t('dataInferred') : rlsText(table.rls);
      if (!table.columns.length) {
        el('text', { class: 'sub', x: place.x + 10, y: place.y + layout.header + 13 }, g).textContent = t('dataNoColumns');
      }
      table.columns.slice(0, layout.maxRows).forEach((column, index) => {
        const y = place.y + layout.header + index * layout.row + 13;
        el('text', { x: place.x + 10, y }, g).textContent = (column.primaryKey ? '◆ ' : column.references ? '→ ' : '  ') + column.name;
        el('text', { class: 'sub', x: place.x + place.w - 8, y, 'text-anchor': 'end' }, g).textContent = (column.type || '').slice(0, 18);
      });
      if (table.columns.length > layout.maxRows) {
        el('text', { class: 'sub', x: place.x + 10, y: place.y + layout.header + layout.maxRows * layout.row + 13 }, g).textContent = t('dataMore', { count: table.columns.length - layout.maxRows });
      }
      el('title', {}, g).textContent = table.name + (table.inferred ? ' · ' + t('dataInferred') : '');
      const choose = event => { event.stopPropagation(); dataSelected = table.name; drawData(dataShown); };
      g.addEventListener('click', choose);

    }
    area.appendChild(svg);
    box.appendChild(area);
    if (data.warnings.length) { box.appendChild(html('h3', t('secretsWarnings') + ' (' + data.warnings.length + ')')); dataFindingList(box, data.warnings, 'warning'); }
    box.appendChild(html('p', t('dataFootnote'), { className: 'muted small' }));
    canvas.appendChild(box);
    if (keep) { area.scrollLeft = keep[0]; area.scrollTop = keep[1]; }

  }
  function usersList(side, title, list) {

      if (item.runsOn) head.appendChild(html('span', item.runsOn === 'client' ? t('leaksBrowser') : item.runsOn === 'server' ? t('leaksServer') : item.runsOn, { className: 'tag ' + item.runsOn }));
      li.appendChild(head);

  }
  function dataCard() {

    const close = html('button', '✕', { className: 'plain', title: t('close') });

    side.appendChild(html('h2', table.name));
    side.appendChild(html('p', [table.store, table.inferred ? t('dataInferred') : t(DATA_SOURCES[table.source] || 'dataInferred')].join(' · '), { className: 'muted' }));
    const findings = [...dataShown.alerts, ...dataShown.warnings].filter(item => item.table === table.name);
    if (findings.length) dataFindingList(side, findings, findings.some(item => item.severity === 'alert') ? 'alert' : 'warning');
    if (table.definedIn.length) { side.appendChild(html('h3', t('dataDefinedIn'))); proofList(side, table.definedIn); }
    side.appendChild(html('h3', t('dataRls')));
    if (table.rls) {
      side.appendChild(html('p', rlsText(table.rls)));

    } else side.appendChild(html('p', t('dataRlsUnknown'), { className: 'muted small' }));
    usersList(side, t('dataReadBy'), table.readers);
    usersList(side, t('dataWrittenBy'), table.writers);
    side.appendChild(html('h3', t('dataColumns') + ' (' + table.columns.length + ')'));
    if (!table.columns.length) side.appendChild(html('p', t('dataColumnsUnknown'), { className: 'muted small' }));
    const ul = html('ul', null, { className: 'facts' });
    for (const column of table.columns) {
      const li = html('li');
      const line = html('button', column.name + (column.type ? ' · ' + column.type : ''), { className: 'fact', title: t('showSource') });
      if (column.primaryKey) line.appendChild(html('span', t('dataKey'), { className: 'tag' }));
      else if (!column.nullable) line.appendChild(html('span', t('dataRequired'), { className: 'tag' }));
      if (column.references) line.appendChild(html('span', '→ ' + column.references.table + (column.references.column ? '.' + column.references.column : '')
        + (dataShown.tables.some(item => item.name === column.references.table) ? '' : ' (' + t('dataOutside') + ')'), { className: 'tag' }));
      const slot = html('div');
      line.addEventListener('click', () => { if (slot.childNodes.length) slot.textContent = ''; else proofList(slot, column.proof); });

    }
    side.appendChild(ul);
  }

  // Phase 8: the structure's health — the smells in order, each with why it
  // matters, its proof, and a way to see it in the plan.
  const SMELL_TEXT = { cycle: ['smell_cycle', 'smell_cycle_why'], 'skipped-layer': ['smell_skipped_layer', 'smell_skipped_layer_why'],
    duplicate: ['smell_duplicate', 'smell_duplicate_why'], 'large-file': ['smell_large_file', 'smell_large_file_why'],
    'unused-export': ['smell_unused_export', 'smell_unused_export_why'] };
  const COUPLING_TEXT = { 'uses-all': ['smell_coupling_uses_all', 'smell_coupling_uses_all_why'], 'used-by-all': ['smell_coupling_used_by_all', 'smell_coupling_used_by_all_why'],
    'file-used-by-many': ['smell_file_used_by_many', 'smell_coupling_used_by_all_why'], 'file-uses-many': ['smell_file_uses_many', 'smell_file_uses_many_why'] };
  const BECAUSE = { folder: 'healthBecauseFolder', name: 'healthBecauseName', public: 'healthBecausePublic', 'by-name': 'healthBecauseByName', vendor: 'healthBecauseVendor' };
  function smellText(item) {
    const files = item.files || [];
    const vars = { files: files.join(' ⇄ '), file: files[0] || '', from: files[0] || '', to: files[1] || '', block: item.blockName || item.block || '',
      count: item.kind === 'duplicate' ? item.places : item.count, tokens: item.tokens, lines: item.lines, limit: item.limit, name: item.name,
      because: item.because ? (BECAUSE[item.because] ? t(BECAUSE[item.because]) : item.because) : '' };
    if (item.kind === 'duplicate') vars.files = files.join(', ') + (item.stretches > 1 ? ' (' + t('smell_duplicate_stretches', { count: item.stretches }) + ')' : '');
    if (item.kind === 'skipped-layer' && item.to) vars.to = files[1] + ' (' + (LAYER_NAMES[item.to.slice(6)] || item.to) + ')';
    const [what, why] = item.kind === 'coupling' ? COUPLING_TEXT[item.direction]
      : item.kind === 'dead-file' ? [item.certainty === 'possible' ? 'smell_dead_file_possible' : 'smell_dead_file', 'smell_dead_file_why']
      : item.kind === 'unused-export' && item.certainty === 'possible' ? ['smell_unused_export_possible', 'smell_unused_export_why'] : SMELL_TEXT[item.kind];
    return [t(what, vars), t(why)];
  }
  function drawHealth(health) {
    const canvas = $('canvas');
    canvas.textContent = '';
    const box = html('div', null, { className: 'leaks' });
    box.appendChild(html('h2', t('healthTitle')));
    const sum = health.summary;
    box.appendChild(html('p', [t('healthCount', { count: sum.total }), ...(sum.possible ? [t('healthPossibleCount', { count: sum.possible })] : [])].join(' · '), { className: 'muted' }));
    box.appendChild(html('p', t('healthIntro'), { className: 'muted small' }));
    if (!health.smells.length) { box.appendChild(html('p', t('healthNone'))); canvas.appendChild(box); return; }
    // One group per kind, in the order of importance; a long group starts closed.
    const GROUPS = { cycle: 'healthGroupCycle', 'skipped-layer': 'healthGroupSkipped', coupling: 'healthGroupCoupling', duplicate: 'healthGroupDuplicate',
      'dead-file': 'healthGroupDead', 'large-file': 'healthGroupLarge', 'unused-export': 'healthGroupUnused' };
    let list = null;
    let kind = null;
    for (const item of health.smells) {
      if (item.kind !== kind) {
        kind = item.kind;
        const group = html('details');
        group.open = health.summary.byKind[kind] <= 10;
        group.appendChild(html('summary', t(GROUPS[kind]) + ' (' + health.summary.byKind[kind] + ')'));
        list = html('ol', null, { className: 'findings' });
        list.classList.add('health');
        group.appendChild(list);
        box.appendChild(group);
      }
      const li = html('li');
      const [what, why] = smellText(item);
      const head = html('div');
      head.appendChild(html('b', what));
      if (item.certainty === 'possible') head.appendChild(html('span', t('healthPossibly'), { className: 'tag' }));
      if (item.blockName) head.appendChild(html('span', item.blockName, { className: 'tag' }));
      li.appendChild(head);
      li.appendChild(html('div', why, { className: 'muted small' }));
      if (item.target) {
        const show = html('button', t('healthShow'), { className: 'plain' });
        show.classList.add('small');
        show.addEventListener('click', () => {
          for (const id of item.target.open) open.add(id);
          save();
          highlight = item.target.id;
          setView('plan').then(() => { selected = { type: 'box', id: item.target.id }; details(); mark(); });
        });
        li.appendChild(show);
      }
      const slot = html('div');
      proofList(slot, item.proof.slice(0, 3));
      if (item.proof.length > 3) {
        const more = html('button', t('healthMoreProof', { count: item.proof.length - 3 }), { className: 'plain' });
        more.classList.add('small');
        more.addEventListener('click', () => { slot.textContent = ''; proofList(slot, item.proof); });
        slot.appendChild(more);
      }
      li.appendChild(slot);
      if (item.key) explainArea(li, { kind: 'alert', source: 'health', key: item.key }, { small: true });
      list.appendChild(li);
    }
    canvas.appendChild(box);
  }

  // Phase 10: the quiz. The questions come without their answers; each answer
  // is sent to the panel, which says whether it is right, with the proof, and
  // counts it on this machine. A new reading of the project only redraws the
  // quiz when its questions changed.
  let quizRound = 0;
  let lastQuiz = '';
  let quizVerdicts = new Map();
  let quizResults = null;
  async function refreshQuiz(wait) {
    let response;
    try { response = await fetch('/api/structure/quiz?run=' + encodeURIComponent(run) + '&round=' + quizRound + (wait ? '&wait=5000' : ''), { cache: 'no-store' }); }
    catch { showStatus(t('panelSilent')); return; }
    const body = await response.json().catch(() => ({}));
    if (view !== 'quiz') return;
    if (response.status === 202) { showStatus(t('reading')); setTimeout(() => refreshQuiz(true), 500); return; }
    if (!response.ok) { showStatus(body.error || t('unreadable')); return; }
    shownReadAt = body.readAt;
    $('tracebar').hidden = true;
    const text = quizRound + JSON.stringify(body.quiz.questions);
    if (text === lastQuiz) return;
    lastQuiz = text;
    quizVerdicts = new Map();
    quizResults = body.quiz.results;
    drawQuiz(body.quiz.questions);
  }
  function quizScore() {
    const parts = [];

    if (quizResults?.answered) parts.push(t('quizScore', { count: quizResults.answered, right: quizResults.right, answered: quizResults.answered }));
    $('quizScore').textContent = parts.join(' · ');
  }
  function drawQuiz(questions) {
    const canvas = $('canvas');
    canvas.textContent = '';
    const box = html('div', null, { className: 'leaks' });
    box.classList.add('quiz');
    box.appendChild(html('h2', t('quizTitle')));
    box.appendChild(html('p', t('quizIntro'), { className: 'muted small' }));
    const bar = html('p', null, { className: 'muted' });
    bar.appendChild(html('span', '', { id: 'quizScore' }));
    const again = html('button', t('quizNew'), { className: 'plain', id: 'quizNew' });
    again.style.marginLeft = '12px';
    again.addEventListener('click', () => { quizRound += 1; lastQuiz = ''; refreshQuiz(); });
    bar.appendChild(again);

    const list = html('ol', null, { className: 'findings' });

      const li = html('li');
      li.dataset.question = question.id;
      li.appendChild(html('div', question.text));
      const choices = html('div', null, { className: 'choices' });
      const buttons = question.choices.map((choice, index) => {
        const button = html('button', choice.text);
        button.addEventListener('click', () => answer(question, index, li, buttons));
        choices.appendChild(button);
        return button;
      });
      li.appendChild(choices);
      list.appendChild(li);
    }
    box.appendChild(list);
    canvas.appendChild(box);
    quizScore();
  }
  async function answer(question, choice, li, buttons) {
    if (quizVerdicts.has(question.id)) return;
    quizVerdicts.set(question.id, {});
    for (const button of buttons) button.disabled = true;
    let response;
    try {
      response = await fetch('/api/structure/quiz/answer?run=' + encodeURIComponent(run), { method: 'POST',
        headers: { 'content-type': 'application/json', 'x-codetac': '1' }, body: JSON.stringify({ round: quizRound, id: question.id, choice }) });
    } catch { quizVerdicts.delete(question.id); for (const button of buttons) button.disabled = false; return; }
    const body = await response.json().catch(() => ({}));
    if (!response.ok) { li.appendChild(html('div', t('quizChanged'), { className: 'muted small' })); return; }
    quizVerdicts.set(question.id, body);
    quizResults = body.results;
    buttons[choice].classList.add('picked');
    buttons[body.answer].classList.add('answer');
    li.classList.add(body.right ? 'right' : 'wrong');
    li.appendChild(html('div', body.right ? t('quizRight') : t('quizWrong', { answer: question.choices[body.answer].text }), { className: 'small' }));
    li.appendChild(html('div', t('quizProof'), { className: 'muted small' }));
    proofList(li, body.proof);
    quizScore();
  }

  // Phase 9: the «Changes» view — the plan of the union of both versions,
  // with its boxes and arrows marked, and the sentences of the summary above it.
  const DIFF_MARK = { added: 'diffMark_added', removed: 'diffMark_removed', changed: 'diffMark_changed', moved: 'diffMark_moved', inside: 'diffMark_inside' };
  const CHANGE_BADGE = { added: '+', removed: '−', changed: '~', moved: '→', inside: '•' };
  const CHANGE_COLOUR = { added: '#2e9d5b', removed: '#d0566a', changed: '#d18a3a', moved: '#d18a3a', inside: '#d18a3a' };
  let diffSnapshot = params.get('snapshot') || 'latest';
  let diffOnly = false;
  let diffShown = null;
  let diffPanel = null;
  let diffOpenedFor = null;
  let diffLit = null;
  let lastDiff = '';
  // The mark of a box or arrow: its change, or none when the filter hides it.
  function diffMark(item) {
    if (!item.change) return null;
    if (!diffOnly || !diffShown) return item.change;
    const allowed = new Set(diffShown.sentences.filter(sentence => sentence.touches.length).flatMap(sentence => sentence.boxes));
    const inPlay = item.from ? allowed.has(item.from) || allowed.has(item.to) : allowed.has(item.id);
    return inPlay ? item.change : 'none';
  }
  // The value of a point in the picker: a commit, a prompt of the Diff (phase D1) or a snapshot.
  function pointValue(item) {
    if (item.type === 'commit') return item.commit;
    if (item.type === 'prompt') return 'prompt-' + item.prompt.n;
    return item.id;
  }
  function promptText(prompt) {
    let state = '';
    if (prompt.status === 'running') state = ' · ' + t('diffPromptRunning');
    if (prompt.status === 'waiting') state = ' · ' + t('diffPromptWaiting');
    if (prompt.status === 'interrupted') state = ' · ' + t('diffPromptInterrupted');
    return t('diffPrompt', { n: prompt.n, date: prompt.startedAt.replace('T', ' ').slice(0, 16) + ' UTC', text: prompt.text.length > 60 ? prompt.text.slice(0, 59) + '…' : prompt.text }) + state;
  }
  // The prompts recorded by the Claude Code hooks (phase D1): the project just before each one.
  function promptsGroup(data, selected) {
    const group = html('optgroup');
    group.label = t('diffPrompts');
    for (const prompt of data.prompts || []) {
      const option = html('option', promptText(prompt), { value: 'prompt-' + prompt.n });
      if (selected === 'prompt-' + prompt.n) option.selected = true;
      group.appendChild(option);
    }
    return group;
  }
  function snapshotText(item) {
    if (item.type === 'prompt') return promptText(item.prompt);
    if (item.type === 'commit' || !item.createdAt) return t('diffCommit', { commit: item.commit.slice(0, 12), date: (item.date || '').slice(0, 10), subject: item.subject || '' });
    const when = item.createdAt.replace('T', ' ').slice(0, 16) + ' UTC';
    const source = item.source === 'commit' ? t('diffSnapshotCommit', { commit: item.commit.slice(0, 12) })
      : item.commit ? t('diffSnapshotChanges', { commit: item.commit.slice(0, 12) }) : t('diffSnapshotNoGit');
    return (item.label ? '«' + item.label + '» · ' : '') + when + ' · ' + source;
  }
  async function saveSnapshotNow(label, prediction = null) {
    const response = await fetch('/api/structure/snapshot?run=' + encodeURIComponent(run), { method: 'POST',
      headers: { 'content-type': 'application/json', 'x-codetac': '1' }, body: JSON.stringify({ label: label || null, ...(prediction ? { prediction } : {}) }) });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) { showStatus(body.error || t('unreadable')); return; }
    diffSnapshot = body.snapshot.id;
    lastDiff = '';
    return refreshDiff();
  }
  function saveControls(parent) {
    const input = html('input', null, { type: 'text', placeholder: t('diffLabelPlaceholder'), id: 'diffLabel', value: predictLabel });
    input.setAttribute('aria-label', t('diffLabelPlaceholder'));
    input.addEventListener('input', () => { predictLabel = input.value; });
    const button = html('button', t('diffSave'), { className: 'plain', title: t('diffSaveTitle'), id: 'diffSave' });
    button.addEventListener('click', () => { predictLabel = ''; saveSnapshotNow(input.value.trim()); });
    const predict = html('button', t('predictButton'), { className: 'plain', title: t('predictButtonTitle'), id: 'predictButton' });
    predict.addEventListener('click', () => (predicting ? closePredict() : openPredict()));
    parent.append(input, button, predict);
  }

  // Phase 10: «Predict» — before asking the AI for a change, the user writes

    if (box.kind === 'symbol' || box.kind === 'route') {
      side.appendChild(html('h3', t('where')));
      const file = plan.boxes.find(item => item.id === box.parent);
      if (file && box.line) proofList(side, [{ file: file.path, line: box.line }]);
    }
  }

  // The card of a block: facts from the structure, each line opening its proof.
  const SECTIONS = [['purpose', t('sectionPurpose')], ['usedBy', t('usedBy')], ['uses', t('uses')], ['data', t('sectionData')],
    ['largest', t('sectionLargest')], ['entries', t('sectionEntries')], ['notes', t('undecided')]];
  async function blockDetails(side, box) {
    side.appendChild(html('h2', box.label));
    side.appendChild(html('p', box.expandable && !box.expanded ? t('clickBlock') : t('files', { count: box.count }), { className: 'muted' }));
    const response = await fetch('/api/structure/card?run=' + encodeURIComponent(run) + '&block=' + encodeURIComponent(box.id), { cache: 'no-store' });
    const card = await response.json().catch(() => null);
    if (selected?.id !== box.id) return;
    if (!response.ok || !card) { side.appendChild(html('p', (card && card.error) || t('cardUnreadable'), { className: 'muted' })); return; }
    for (const [section, title] of SECTIONS) {
      const facts = card.facts.filter(fact => fact.section === section);
      if (!facts.length) continue;
      side.appendChild(html('h3', title));
      const list = html('ul', null, { className: 'facts' });
      for (const fact of facts) {
        const item = html('li');
        const line = html('button', fact.text, { className: 'fact', title: t('showSource') });
        const slot = html('div');
        line.addEventListener('click', () => {
          if (slot.childNodes.length) { slot.textContent = ''; return; }
          proofList(slot, fact.proof);
        });
        item.append(line, slot);
        list.appendChild(item);
      }
      side.appendChild(list);
    }
    side.appendChild(html('p', t('everyLine'), { className: 'muted small' }));
    if (card.actions?.length) {
      side.appendChild(html('h3', t('actionsHere')));
      const list = html('ul', null, { className: 'facts' });
      for (const item of card.actions) {
        const li = html('li');
        const button = html('button', item.label, { className: 'fact', title: t('lightAction') });
        button.addEventListener('click', () => { action = item.actionId; request = ''; focus = ''; lastText = ''; refresh(); });
        li.appendChild(button);
        list.appendChild(li);
      }
      side.appendChild(list);
    }
    explainArea(side, box);
  }

  // Optional AI explanation: preview of the exact request, then consent.
  // subject: { kind: 'block', block } (phase 3), { kind: 'plan' } or
  // { kind: 'alert', source, key, snapshot } (phase 10). The answer is always
  // labelled as an explanation written by AI from the facts shown.
  function explainArea(side, subject, { open: startOpen = false, small = false } = {}) {
    if (subject.id) subject = { kind: 'block', block: subject.id };
    const area = html('div', null, { className: 'explain' + (small ? ' inline' : '') });
    const start = html('button', t(small ? 'explainAlert' : 'explain'), { className: 'plain', title: t('explainTitle') });
    if (small) start.classList.add('small');
    area.appendChild(start);
    side.appendChild(area);
    const query = Object.entries(subject).filter(([, value]) => value != null).map(([name, value]) => '&' + name + '=' + encodeURIComponent(value)).join('');
    const show = result => {
      const out = html('div', null, { className: 'explanation' });
      out.appendChild(html('h3', t('explanationBy', { model: result.model })));
      if (result.rejected) out.appendChild(html('p', t('rejected', { reason: result.rejected }), { className: 'muted' }));
      else out.appendChild(html('p', result.explanation));
      return out;
    };
    start.addEventListener('click', async () => {
      area.textContent = '';
      const response = await fetch('/api/structure/explain/preview?run=' + encodeURIComponent(run) + query, { cache: 'no-store' });
      const preview = await response.json().catch(() => ({}));
      if (!response.ok) { area.appendChild(html('p', preview.error || t('previewFailed'), { className: 'muted' })); return; }
      // Privacy (phase 10, step 5): switched off there, with a link to it.
      if (!preview.active && preview.blocked) {
        const note = html('p', preview.problem + ' ', { className: 'muted' });
        note.classList.add('blocked');
        note.appendChild(html('a', t('privacyLink'), { href: $('privacyLink').href }));
        area.appendChild(note);
        return;
      }
      if (!preview.active) { area.appendChild(html('p', preview.problem ? t('noModelBecause', { problem: preview.problem }) : t('noModel'), { className: 'muted' })); return; }
      if (preview.cached) { area.appendChild(show({ ...preview.cached, model: preview.model })); return; }
      area.appendChild(html('h3', t(preview.local ? 'willSendLocal' : 'willSend', { provider: preview.provider, model: preview.model })));
      area.appendChild(html('p', t('onlyFacts'), { className: 'muted small' }));
      area.appendChild(html('pre', preview.system + '\n\n' + preview.text));
      const send = html('button', t('send'), { className: 'plain' });
      const cancel = html('button', t('cancel'), { className: 'plain' });
      cancel.style.marginLeft = '14px';
      cancel.addEventListener('click', () => { area.textContent = ''; area.appendChild(start); });
      send.addEventListener('click', async () => {
        send.disabled = true;
        send.textContent = t('waiting');
        const answer = await fetch('/api/structure/explain?run=' + encodeURIComponent(run), { method: 'POST', cache: 'no-store',
          headers: { 'content-type': 'application/json', 'x-codetac': '1' }, body: JSON.stringify({ ...subject, hash: preview.hash }) });
        const result = await answer.json().catch(() => ({}));
        area.textContent = '';
        if (!answer.ok) { area.appendChild(html('p', result.error || t('explainFailed'), { className: 'muted' })); area.appendChild(start); return; }
        area.appendChild(show(result));
      });
      area.append(send, cancel);
    });
    if (startOpen) start.click();
  }

  // Search by name: opens what is needed to show the result.
  let searchTimer = null;
  $('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      const q = $('q').value.trim();
      const results = $('results');
      results.textContent = '';
      if (!q) { results.hidden = true; return; }
      const response = await fetch('/api/structure/search?run=' + encodeURIComponent(run) + '&q=' + encodeURIComponent(q), { cache: 'no-store' });
      const body = await response.json().catch(() => ({ results: [] }));
      results.hidden = false;
      if (!body.results?.length) { results.appendChild(html('div', t('nothingFound'), { className: 'status' })); return; }
      for (const result of body.results) {
        const button = html('button', result.name);
        button.appendChild(html('small', result.kind + (result.path ? ' · ' + result.path : result.file ? ' · ' + result.file + ':' + result.line : '')));
        button.addEventListener('click', () => {
          for (const id of result.open) open.add(id);
          save();
          highlight = result.id;
          selected = { type: 'box', id: result.id };
          results.hidden = true;
          lastText = '';
          refresh().then(details);
        });
        results.appendChild(button);
      }
    }, 200);
  });
  document.addEventListener('click', event => { if (!event.target.closest('.search')) $('results').hidden = true; });
  $('coverage').addEventListener('click', () => { coverage = !coverage; $('coverage').textContent = coverage ? t('hideNeverRan') : t('neverRan'); lastText = ''; refresh(); });
  function showButtons() {
    for (const [name, key] of [['leaks', 'leaksButton'], ['secrets', 'secretsButton'], ['data', 'dataButton'], ['health', 'healthButton'], ['diff', 'diffButton'], ['quiz', 'quizButton']]) {
      $(name + 'Button').classList.toggle('on', view === name);
      $(name + 'Button').textContent = view === name ? t('leaksBack') : t(key);
    }
    if (reviewDebt?.total && view !== 'diff') {
      $('diffButton').appendChild(html('span', String(reviewDebt.total), { className: 'badge', title: t('reviewDebt', { count: reviewDebt.total }) }));
      $('diffButton').title = t('reviewDebt', { count: reviewDebt.total });
    } else $('diffButton').title = t('diffButtonTitle');
    for (const id of ['coverage', 'collapse', 'legend', 'explainPlan']) $(id).hidden = view !== 'plan' && !(view === 'diff' && id === 'collapse');
  }
  function setView(next) {
    view = next;
    dataSelected = null;
    lastDiff = ''; diffLit = null;
    selected = null;
    details();
    showButtons();
    lastText = ''; lastTable = ''; lastQuiz = '';
    const url = new URL(location.href);
    if (view !== 'plan') url.searchParams.set('view', view); else url.searchParams.delete('view');
    if (view !== 'diff') url.searchParams.delete('snapshot');
    history.replaceState(null, '', url);
    return refresh();
  }
  $('leaksButton').addEventListener('click', () => setView(view === 'leaks' ? 'plan' : 'leaks'));
  $('secretsButton').addEventListener('click', () => setView(view === 'secrets' ? 'plan' : 'secrets'));
  $('dataButton').addEventListener('click', () => setView(view === 'data' ? 'plan' : 'data'));
  $('healthButton').addEventListener('click', () => setView(view === 'health' ? 'plan' : 'health'));
  $('diffButton').addEventListener('click', () => setView(view === 'diff' ? 'plan' : 'diff'));
  $('quizButton').addEventListener('click', () => setView(view === 'quiz' ? 'plan' : 'quiz'));
  $('explainPlan').addEventListener('click', () => { selected = { type: 'plan-explain' }; details(); });
  $('collapse').addEventListener('click', () => { open.clear(); save(); selected = null; highlight = null; details(); lastText = ''; refresh(); });

  // Phase 10, step 5: the Privacy screen, and back here after it.
  $('privacyLink').href = '/privacy?back=' + encodeURIComponent(location.pathname + location.search);
  legend();
  showButtons();
  refresh(true);
  refreshDebt();
  setInterval(() => { if (!document.hidden) { refresh(); if (view !== 'diff') refreshDebt(); } }, 10000);
  // Watch mode: a light look every 2 s; a new reading of the project redraws the plan at once.
  setInterval(async () => {
    if (document.hidden || !run || !shownReadAt) return;
    try {
      const body = await (await fetch('/api/structure?run=' + encodeURIComponent(run), { cache: 'no-store' })).json();
      if (body.readAt && body.readAt !== shownReadAt) { refresh(); if (view !== 'diff') refreshDebt(); }
    } catch {}
  }, 2000);
})();
</script>
</body>
</html>
